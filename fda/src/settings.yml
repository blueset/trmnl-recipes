---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.2.0
serverless_language: ''
polling_url: https://www.fda.gov/datatables/views/ajax?search_api_fulltext=&field_regulated_product_field={{field_regulated_product_field}}&field_terminated_recall={{field_terminated_recall}}&draw=2&columns[0][data]=0&columns[0][name]=&columns[0][searchable]=true&columns[0][orderable]=true&columns[0][search][value]=&columns[0][search][regex]=false&columns[1][data]=1&columns[1][name]=&columns[1][searchable]=true&columns[1][orderable]=true&columns[1][search][value]=&columns[1][search][regex]=false&columns[2][data]=2&columns[2][name]=&columns[2][searchable]=true&columns[2][orderable]=true&columns[2][search][value]=&columns[2][search][regex]=false&columns[3][data]=3&columns[3][name]=&columns[3][searchable]=true&columns[3][orderable]=true&columns[3][search][value]=&columns[3][search][regex]=false&columns[4][data]=4&columns[4][name]=&columns[4][searchable]=true&columns[4][orderable]=true&columns[4][search][value]=&columns[4][search][regex]=false&columns[5][data]=5&columns[5][name]=&columns[5][searchable]=true&columns[5][orderable]=true&columns[5][search][value]=&columns[5][search][regex]=false&columns[6][data]=6&columns[6][name]=&columns[6][searchable]=true&columns[6][orderable]=false&columns[6][search][value]=&columns[6][search][regex]=false&columns[7][data]=7&columns[7][name]=&columns[7][searchable]=true&columns[7][orderable]=false&columns[7][search][value]=&columns[7][search][regex]=false&start=0&length=30&search[value]={{search_kw}}&search[regex]=false&_drupal_ajax=1&_wrapper_format=drupal_ajax&pager_element=0&view_args=&view_base_path=safety/recalls-market-withdrawals-safety-alerts/datatables-data&view_display_id=recall_datatable_block_1&view_dom_id=e84894d97ff143559797cd4fc84b381534f78a90e181c37ae5401a61e5563d55&view_name=recall_solr_index&view_path=/safety/recalls-market-withdrawals-safety-alerts&total_items=1024
polling_headers: "Accept: application/json\r\nUser-Agent: trmnl-fda-recalls/1.0.{{ \"today\" | date: \"%N\" }}\r\n"
polling_body: ''
id: 453276
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About This Plugin
  description: Recent recalls, market withdrawals, and safety alerts of FDA-regulated products. Data courtesy of <a href="https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts">FDA</a>.
  learn_more_url: https://www.fda.gov/safety/recalls-market-withdrawals-safety-alerts
  category: life,news
  github_url: https://github.com/blueset/trmnl-recipes
- keyname: search_kw
  field_type: string
  name: Search keyword
  help_text: Leave empty to show all
  optional: true
- keyname: field_regulated_product_field
  field_type: select
  name: Product Type
  default: All
  options:
  - All: All
  - Animal & Veterinary: '2274'
  - Biologics: '2286'
  - Cosmetics: '2294'
  - Dietary Supplements: '2305'
  - Drugs: '2312'
  - Food & Beverages: '2323'
  - Medical Devices: '2374'
  - Radiation-Emitting Products: '2393'
  - Tobacco: '2398'
- keyname: field_terminated_recall
  field_type: select
  name: Terminated Recall
  default: All
  options:
  - All: All
  - 'Yes': '1'
  - 'No': '0'
name: US FDA Recalls
description: Recalls, Withdrawals, Safety Alerts
refresh_interval: 1440
