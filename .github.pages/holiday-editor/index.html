<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holiday Config Editor — TRMNL Recipes</title>
  <meta name="theme-color" content="#111419">
  <script>
    try {
      const preference = localStorage.getItem('trmnl-holiday-editor:theme') || 'dark';
      document.documentElement.dataset.theme = preference === 'system'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
    } catch { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app">
  <noscript>This editor needs JavaScript.</noscript>
</div>
</body>
</html>
