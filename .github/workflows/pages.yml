name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - ".github.pages/**"
      - ".github/workflows/pages.yml"
      - "README.md"
      - "*/.trmnlp.yml"
      - "*/README.md"
      - "*/src/settings.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate recipe index
        env:
          REPOSITORY_RAW_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/
        run: node .github.pages/generate-recipes.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.github.pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
